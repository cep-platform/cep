services:

  caddy:
    image: caddy:2
    container_name: cep-caddy
    networks:
      - cep
    restart: unless-stopped
    environment:
      CADDY_ADMIN: "0.0.0.0:2019"
    ports:
      - "8080:80"
      - "9443:443"
      - "9443:443/udp"
    # volumes:
      # - ./conf:/etc/caddy
      # - ./site:/srv
      # - caddy_data:/data
      # - caddy_config:/config

  # The cep image is built from nix (distroless OCI, Entrypoint = `cep`) by
  # ./image/build.sh; `command:` supplies the entrypoint's arguments.
  cep-main:
    networks:
      - cep
    image: localhost/cep:latest
    container_name: cep-main
    command: ["server", "run"]
    ports:
      - "8000:8000"
    environment:
      APP_STORE_HOST_NAME: "cep-appstore"
      CEP_SERVER_TOKEN: "${CEP_SERVER_TOKEN}"
      DNS_IP: "${DNS_IP}"
      DNS_TOKEN: "${DNS_TOKEN}"
    volumes:
      - ./.env:/app/.env:ro # tf? 
      # - cep-server-state:/root/.local/share/cep

  cep-appstore:
    networks:
      - cep
    image: localhost/cep:latest
    container_name: cep-appstore
    command: ["apps", "run"]
    volumes:
      - ./.env:/app/.env:ro
      # - cep-appstore-state:/root/.local/share/cep

networks:
  cep:

