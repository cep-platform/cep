services:
  # Explicitly build the shared Cep image before deployment:
  # incus-compose --profile build build cep-build
  cep-build:
    image: localhost/cep:latest
    build:
      context: .
    profiles:
      - build

  caddy:

    image: caddy:2
    container_name: cep-caddy
    networks: 
      - cep
    restart: unless-stopped
    environment:
      CADDY_ADMIN: "0.0.0.0:2019"
    ports:
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      # - ./conf:/etc/caddy
      # - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config

  cep-dns:
    build:
      context: ./unbound
    network_mode: host
    container_name: cep-dns 
    volumes:
      - unbound-state:/var/lib/unbound

      # dev
      - ./unbound/service/api.py:/app/api.py
    restart: unless-stopped
    command: uvicorn api:app --host 0.0.0.0 --port 8053
    environment:
      DNS_TOKEN: "${DNS_TOKEN}"


  cep-client:
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    image: localhost/cep:latest
    container_name: cep-client 
    command: >
      /app/start.sh
    environment:
      CEP_SERVER_URL: "${CEP_SERVER_URL}"
      CEP_SERVER_TOKEN: "${CEP_SERVER_TOKEN}"
      LIGHTHOUSE_STABLE_IP: "${LIGHTHOUSE_STABLE_IP}"
    depends_on:
      - cep-main
    volumes:
      - ./.env:/app/.env:ro
      # dev
      - ./src:/app/src


  cep-main:
    networks: 
      - cep
    image: localhost/cep:latest
    container_name: cep-main 
    command: >
      uv run cep server run
    ports:
      - "8000:8000"
    environment:
      APP_STORE_HOST_NAME: "cep-appstore"
      CEP_SERVER_TOKEN: "${CEP_SERVER_TOKEN}"
      DNS_IP: "${DNS_IP}"
      DNS_TOKEN: "${DNS_TOKEN}"
    volumes:
      - ./.env:/app/.env:ro
      # - cep-server-state:/root/.local/share/cep
      # dev
      - ./src:/app/src


  cep-appstore:
    networks: 
      - cep
    image: localhost/cep:latest
    container_name: cep-appstore
    command: >
      uv run cep apps run
    volumes:
      - ./.env:/app/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src:/app/src


networks:
  cep:
    driver: bridge


volumes:
  unbound-state:
  caddy_data:
  caddy_config:
  # cep-server-state:
