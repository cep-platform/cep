services:
  redis:
    networks: 
      - cep
    image: redis:7-alpine
    container_name: cep-app-redis
    labels:
      cep.proxy.port: "6379"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis-data:

networks:
  #TODO: temporary fix until more coherent networking is designed for cep
  cep:
    name: cep
    external: true

