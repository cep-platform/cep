services:
  redis:
    networks: 
      - cep
    image: redis:7-alpine
    container_name: cep-app-redis
    labels:
      cep.proxy.port: "6379"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis-data:

networks:
  # The stack's shared bridge (name pinned in compose.yml). caddy dials
  # deployed apps by instance name, so they must join this exact network.
  # external: app deployments never create or delete it.
  cep:
    name: cep
    external: true

