x-cep:
  proxy:
    port: 6379

services:
  redis:
    networks: 
      - cep
    image: redis:7-alpine
    container_name: cep-app-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis-data:

