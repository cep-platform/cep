services:
  python-app:
    networks: 
      - cep
    image: python:3.11-slim
    container_name: cep-app-python
    labels:
      cep.proxy.port: "8069"
    volumes:
      - ./app:/app
    working_dir: /app
    command: python -m http.server 8069
    ports:
      - "8069:8069"
    restart: unless-stopped

networks:
  # The stack's shared bridge (name pinned in compose.yml). caddy dials
  # deployed apps by instance name, so they must join this exact network.
  # external: app deployments never create or delete it.
  cep:
    name: cep
    external: true
