services:
  nginx:
    networks: 
      - cep
    image: nginx:alpine
    container_name: cep-app-nginx
    labels:
      cep.proxy.port: "6969"
    ports:
      - "6969:6969"
      - "8443:8443"
    # volumes:
    #   - ./html:/usr/share/nginx/html
    #   - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

networks:
  # The stack's shared bridge (name pinned in compose.yml). caddy dials
  # deployed apps by instance name, so they must join this exact network.
  # external: app deployments never create or delete it.
  cep:
    name: cep
    external: true

