services:
  nginx:
    networks: 
      - cep
    image: nginx:alpine
    container_name: cep-app-nginx
    labels:
      cep.proxy.port: "6969"
    ports:
      - "6969:6969"
      - "8443:8443"
    # volumes:
    #   - ./html:/usr/share/nginx/html
    #   - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

