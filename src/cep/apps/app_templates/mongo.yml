services:
  mongo:
    networks: 
      - cep
    image: mongo:7
    container_name: cep-app-mongo
    labels:
      cep.proxy.port: "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  # The stack's shared bridge (name pinned in compose.yml). caddy dials
  # deployed apps by instance name, so they must join this exact network.
  # external: app deployments never create or delete it.
  cep:
    name: cep
    external: true
