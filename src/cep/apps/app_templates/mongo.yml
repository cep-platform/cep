x-cep:
  proxy:
    port: 27017

services:
  mongo:
    networks: 
      - cep
    image: mongo:7
    container_name: cep-app-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
