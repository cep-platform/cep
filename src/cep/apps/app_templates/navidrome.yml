services:
  navidrome:
    networks: 
      - cep
    image: deluan/navidrome:latest
    container_name: cep-app-navidrome
    labels:
      cep.proxy.port: "4533"
    # user: 1000:1000 # should be owner of volumes
    ports:
      - "4533:4533"
    restart: unless-stopped
    volumes:
      - data:/data
      - music:/music:ro

volumes:
  data:
  music:

    
networks:
  # The stack's shared bridge (name pinned in compose.yml). caddy dials
  # deployed apps by instance name, so they must join this exact network.
  # external: app deployments never create or delete it.
  cep:
    name: cep
    external: true
